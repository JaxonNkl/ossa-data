name: Refresh OSSA public sources
on:
  push:
    paths:
      [
        "ingestion/**",
        "worker/**",
        "package*.json",
        ".github/workflows/refresh.yml",
      ]
  workflow_dispatch:
  schedule:
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
permissions:
  contents: read
concurrency:
  group: ossa-ingestion
  cancel-in-progress: false
jobs:
  refresh:
    if: vars.CLOUDFLARE_ACCOUNT_ID != '' && vars.CLOUDFLARE_KV_NAMESPACE_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Record trigger
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          echo "Trigger: $TRIGGER_EVENT" >> "$GITHUB_STEP_SUMMARY"
          date -u +"Started: %Y-%m-%dT%H:%M:%SZ" >> "$GITHUB_STEP_SUMMARY"
      - run: node ingestion/run.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ vars.CLOUDFLARE_KV_NAMESPACE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
